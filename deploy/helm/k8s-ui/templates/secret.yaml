{{- if not .Values.auth.existingSecret }}
{{- if empty .Values.auth.users }}
{{- fail "auth.users is empty. Add at least one user (see values.yaml) or set auth.existingSecret." }}
{{- end }}
{{- $secretName := include "k8s-ui.authSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $sessionSecret := "" }}
{{- if and $existing (hasKey $existing.data "session-secret") }}
{{- $sessionSecret = index $existing.data "session-secret" | b64dec }}
{{- else }}
{{- $sessionSecret = randAlphaNum 48 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "k8s-ui.labels" . | nindent 4 }}
type: Opaque
stringData:
  users.json: {{ .Values.auth.users | toJson | quote }}
  # Kept across upgrades so existing sessions stay valid.
  session-secret: {{ $sessionSecret | quote }}
{{- end }}
